<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-box {
            position: fixed;
            right: 0;
            bottom: 0;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 3px solid transparent;
            background-image:
                linear-gradient(#f9f9f9, #f9f9f9),
                linear-gradient(270deg, #ff512f, #dd2476, #1fa2ff, #12d8fa, #a6ffcb, #f7971e, #f953c6, #43e97b, #38f9d7, #ff512f);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            background-size: 100% 100%, 2000% 2000%;
            animation: gradientBorderMove 8s ease infinite;
            z-index: 10;
        }
        @keyframes gradientBorderMove {
            0%,100% { background-position: 0% 0%, 0% 50%; }
            50% { background-position: 0% 0%, 100% 50%; }
        }
        .login-box-inner {
            width: 100%;
            padding: 28px 18px 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-box h2 { margin-bottom: 18px; }
        
        form { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; }
            
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            margin-left: 12px;
        }
        .form-row label {
            min-width: 75px;
            margin-right: 8px;
            font-size: 15px;
        }
        .form-row input[type="text"],
        .form-row input[type="password"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 90%;
        }
        .gradient-btn, .register-link-btn {
            flex: 1;
            padding: 7px 0;
            border-radius: 4px;
            font-size: 15px;
            text-align: center;
            transition: box-shadow 0.2s, background 0.2s, color 0.2s;
        }
        .gradient-btn {
            color: #fff;
            border: none;
            background: linear-gradient(270deg, #ff512f, #dd2476, #1fa2ff, #12d8fa, #a6ffcb, #f7971e, #f953c6, #43e97b, #38f9d7, #ff512f);
            background-size: 2000% 2000%;
            animation: gradientMove 8s ease infinite;
            box-shadow: 0 2px 8px rgba(0,123,255,0.15);
            cursor: pointer;
        }
        .register-link-btn {
            color: black;
            margin-left: 12px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,123,255,0.05);
            display: inline-block;
        }
        .register-link-btn:hover {
            background: grey;
            color: #fff;
        }
        @keyframes gradientMove {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-box-inner">
            <form method="post">
                <div class="form-row">
                    <label for="username">Username:</label>
                    <input type="text" name="username" id="username" required>
                </div>
                <div class="form-row">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required>
                </div>
                <div class="button-row">
                    <a href="/register" class="register-link-btn">Register</a>
                    <input type="submit" value="Login" class="gradient-btn">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
