<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            min-height: 100vh; margin: 0;
            font-family: Arial, sans-serif;
            display: flex; align-items: flex-start; justify-content: flex-start;
        }
        .register-container {
            margin: 48px 0 0 -55px; background: #fff;
            padding: 32px 36px; min-width: 320px;
        }
        .register-container h2 { margin: 0 0 20px 0; font-weight: bold; color: #333; }
        .form-row {
            display: flex; align-items: center; margin-bottom: 16px;
        }
        .form-row label {
            min-width: 100px; margin-right: 16px; color: #222;
            font-size: 15px; text-align: right;
        }
        @keyframes inputGradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .register-container input[type="text"],
        .register-container input[type="date"],
        .register-container input[type="password"] {
            width: 220px; padding: 7px 8px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 15px; box-sizing: border-box;
            background: linear-gradient(270deg,#ffecd2,#fcb69f,#a1c4fd,#c2e9fb,#fbc2eb,#fdcbf1,#ffecd2);
            background-size: 1400% 1400%; animation: inputGradientMove 8s ease infinite;
            color: #222; transition: box-shadow 0.2s;
        }
        .register-container input[type="file"] { display: none; }
        .custom-file-label {
            display: inline-block; padding: 7px 18px;
            background: linear-gradient(270deg,#a1c4fd,#c2e9fb,#fbc2eb,#fdcbf1,#ffecd2);
            background-size: 1400% 1400%; animation: inputGradientMove 8s ease infinite;
            color: #222; border: 1px solid #ccc; border-radius: 4px;
            font-size: 15px; cursor: pointer; transition: box-shadow 0.2s, background 0.2s;
            margin-right: 10px;
        }
        .custom-file-label:hover {
            box-shadow: 0 2px 8px rgba(0,123,255,0.12);
            background: linear-gradient(90deg, #fbc2eb, #a1c4fd);
        }
        .file-name {
            font-size: 14px; color: #555; margin-left: 8px;
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .register-container input[type="submit"] {
            margin: 16px 0 0 188px; padding: 9px 0; width: 40%;
            background-size: 1400% 1400%; animation: inputGradientMove 8s ease infinite;
            color: #000; border: 0.7px solid #000; border-radius: 4px;
            font-size: 16px; cursor: pointer; transition: box-shadow 0.2s;
        }
        .register-container input[type="submit"]:hover {
            box-shadow: 0 4px 16px rgba(0,123,255,0.18);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <form method="post" enctype="multipart/form-data">
            <div class="form-row">
                <label for="image">Image:</label>
                <label for="image" class="custom-file-label">Choose Image</label>
                <input type="file" name="image" id="image" accept="image/*" onchange="updateFileName()">
                <span class="file-name" id="fileName"></span>
            </div>
            <div class="form-row"><label for="name">Name:</label><input type="text" name="name" id="name" required></div>
            <div class="form-row"><label for="birthday">Birthday:</label><input type="date" name="birthday" id="birthday" required></div>
            <div class="form-row"><label for="address">Address:</label><input type="text" name="address" id="address" required></div>
            <div class="form-row"><label for="username">Username:</label><input type="text" name="username" id="username" required></div>
            <div class="form-row"><label for="password">Password:</label><input type="password" name="password" id="password" required></div>
            <input type="submit" value="Register">
        </form>
    </div>
    <script>
        function updateFileName() {
            const input = document.getElementById('image');
            const fileNameSpan = document.getElementById('fileName');
            fileNameSpan.textContent = input.files && input.files.length ? input.files[0].name : '';
        }
    </script>
</body>
</html>
